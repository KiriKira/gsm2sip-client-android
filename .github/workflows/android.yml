name: Android client

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      signed_debug:
        description: Build a debuggable APK with the permanent release signing identity for this validation branch
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --max-workers=2
      - name: Record debug build identity
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          info = json.loads(Path('debug-batch.json').read_text())
          info.update(source_commit=os.environ['GITHUB_SHA'], run_url=os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'])
          info['sha256'] = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('app/build/outputs/apk/debug').glob('*.apk')}
          if Path('gateway-magisk.zip').exists():
              info['sha256']['gateway-magisk.zip'] = hashlib.sha256(Path('gateway-magisk.zip').read_bytes()).hexdigest()
          Path('BUILD-INFO.json').write_text(json.dumps(info, indent=2) + '\n')
          PY
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gsm2sip-host-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            BUILD-INFO.json
            DEBUG-BATCH.md
          if-no-files-found: error

  signed-debug:
    name: Permanent-key signed debug APK
    if: github.event_name == 'workflow_dispatch' && inputs.signed_debug == true && github.ref == 'refs/heads/ci/webrtc-sip-debug-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35 build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assign an installable validation version
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'GSM_RELEASE_VERSION_CODE=1000000000'
            echo "GSM_RELEASE_VERSION_NAME=0.3.0-debug-build-${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_ENV"
      - name: Test and build debuggable ARM64 APK
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --max-workers=2
      - name: Decode the configured permanent signing key and check its pin
        shell: bash
        env:
          GSM_RELEASE_KEYSTORE_BASE64: ${{ secrets.GSM_RELEASE_KEYSTORE_BASE64 }}
          GSM_RELEASE_STORE_PASSWORD: ${{ secrets.GSM_RELEASE_STORE_PASSWORD }}
          GSM_RELEASE_KEY_ALIAS: ${{ secrets.GSM_RELEASE_KEY_ALIAS }}
          GSM_RELEASE_KEY_PASSWORD: ${{ secrets.GSM_RELEASE_KEY_PASSWORD }}
          GSM_RELEASE_CERT_SHA256: ${{ vars.GSM_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in GSM_RELEASE_KEYSTORE_BASE64 GSM_RELEASE_STORE_PASSWORD GSM_RELEASE_KEY_ALIAS GSM_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required repository secret $name is not configured."
              exit 1
            fi
          done
          pin="${GSM_RELEASE_CERT_SHA256//:/}"
          pin="${pin,,}"
          if [[ ! "$pin" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::GSM_RELEASE_CERT_SHA256 must be a 64-hex SHA-256 fingerprint.'
            exit 1
          fi
          keystore="$RUNNER_TEMP/gsm2sip-release-signing.jks"
          printf '%s' "$GSM_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          actual="$(keytool -exportcert -keystore "$keystore" -storepass:env GSM_RELEASE_STORE_PASSWORD -alias "$GSM_RELEASE_KEY_ALIAS" | sha256sum | awk '{print tolower($1)}')"
          if [[ "$actual" != "$pin" ]]; then
            echo '::error::Configured keystore does not match the permanent release certificate pin.'
            exit 1
          fi
          echo "GSM_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"
      - name: Sign APK with the permanent key and verify package signature
        shell: bash
        env:
          GSM_RELEASE_STORE_PASSWORD: ${{ secrets.GSM_RELEASE_STORE_PASSWORD }}
          GSM_RELEASE_KEY_ALIAS: ${{ secrets.GSM_RELEASE_KEY_ALIAS }}
          GSM_RELEASE_KEY_PASSWORD: ${{ secrets.GSM_RELEASE_KEY_PASSWORD }}
          GSM_RELEASE_CERT_SHA256: ${{ vars.GSM_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" sign \
            --ks "$GSM_RELEASE_STORE_FILE" \
            --ks-key-alias "$GSM_RELEASE_KEY_ALIAS" \
            --ks-pass env:GSM_RELEASE_STORE_PASSWORD \
            --key-pass env:GSM_RELEASE_KEY_PASSWORD \
            --out host-debug-arm64.apk "$apk"
          "$tools/apksigner" verify --verbose --print-certs host-debug-arm64.apk > signature.txt
          cat signature.txt
          expected="${GSM_RELEASE_CERT_SHA256//:/}"
          expected="${expected,,}"
          actual="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print tolower($2); exit }' signature.txt)"
          [[ "$actual" == "$expected" ]] || { echo '::error::APK certificate does not match the permanent release certificate pin.'; exit 1; }
          "$tools/aapt" dump badging host-debug-arm64.apk > badging.txt
          grep -qx 'application-debuggable' badging.txt
          sha256sum host-debug-arm64.apk > SHA256SUMS.txt
          cat > BUILD-REPORT.md <<EOF
          # Host signed debug build

          Source: ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}
          Android variant: debuggable, version ${GSM_RELEASE_VERSION_NAME} (${GSM_RELEASE_VERSION_CODE})
          APK signing certificate SHA-256: ${expected}
          APK SHA-256: $(sha256sum host-debug-arm64.apk | awk '{print $1}')
          Unit tests and lint: passed
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: host-permanent-key-signed-debug
          path: |
            host-debug-arm64.apk
            SHA256SUMS.txt
            BUILD-REPORT.md
          if-no-files-found: error
          retention-days: 14
