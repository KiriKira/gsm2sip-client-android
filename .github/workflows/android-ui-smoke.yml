name: Android KVM UI smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-ui-smoke.yml'
      - 'app/**'
      - 'scripts/android-ui-smoke.py'
      - 'scripts/run-native-smoke.sh'
      - 'scripts/run-paired-ui-fixture.sh'
      - 'scripts/native-smoke/**'
      - 'scripts/paired-ui-fixture/**'
      - 'scripts/paired-ui-fixture.py'

permissions:
  contents: read

jobs:
  host-ui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build debug APK
        run: |
          set -o pipefail
          mkdir -p artifacts/android-ui-smoke
          ./gradlew :app:assembleDebug :app:signingReport --no-daemon --max-workers=2 --console=plain \
            | tee artifacts/android-ui-smoke/gradle-signing-report.txt
          debug_keystore="$(awk '
            /^Variant: debug[[:space:]]*$/ { in_debug=1; next }
            /^Variant:/ { in_debug=0 }
            in_debug && /^Store:[[:space:]]*/ { sub(/^Store:[[:space:]]*/, ""); print; exit }
          ' artifacts/android-ui-smoke/gradle-signing-report.txt)"
          if [[ -z "$debug_keystore" || ! -f "$debug_keystore" ]]; then
            echo "Gradle signingReport did not resolve an existing debug keystore: ${debug_keystore:-missing Store path}" >&2
            exit 1
          fi
          if [[ -z "${RUNNER_TEMP:-}" || -z "${GITHUB_ENV:-}" ]]; then
            echo 'RUNNER_TEMP and GITHUB_ENV are required to preserve the signing key for the emulator step' >&2
            exit 1
          fi
          smoke_keystore="$RUNNER_TEMP/gsm2sip-host-debug.keystore"
          install -m 600 "$debug_keystore" "$smoke_keystore"
          echo "PJSUA_SMOKE_KEYSTORE=$smoke_keystore" >> "$GITHUB_ENV"
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee artifacts/android-ui-smoke/apk.sha256

      - name: Install and exercise the host app on a foldable emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: 7.6in Foldable
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 360
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            python3 scripts/android-ui-smoke.py --apk app/build/outputs/apk/debug/app-debug.apk --package com.callagent.host --scenario host --device-profile '7.6in Foldable' --artifact-dir artifacts/android-ui-smoke &&
            bash scripts/run-native-smoke.sh &&
            bash scripts/run-paired-ui-fixture.sh

      - name: Upload UI and native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsm2sip-host-android-ui-smoke
          path: |
            artifacts/android-ui-smoke/**
            app/build/outputs/apk/debug/**
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload compact UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsm2sip-host-ui-diagnostics
          path: |
            artifacts/android-ui-smoke/**/*.json
            artifacts/android-ui-smoke/**/*.txt
            artifacts/android-ui-smoke/**/*.xml
            artifacts/android-ui-smoke/**/*.log
            artifacts/android-ui-smoke/**/*.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsm2sip-host-ui-key-screenshots
          path: artifacts/android-ui-smoke/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tested host APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsm2sip-host-runtime-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
